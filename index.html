List comprehension adalah cara ringkas membuat list:

Virtual environment sebaiknya selalu dipakai per proyek:

Itinerary 7 hari: Tokyo (3 hari), Kyoto (2 hari), Osaka (2 hari).
Budget estimasi: tiket pesawat 8 juta, hotel 6 juta, makan dan transport 5 juta.

Di Tokyo wajib ke: Asakusa, Shibuya crossing, Akihabara, dan teamLab Planets.
Di Kyoto: Fushimi Inari, Arashiyama bamboo grove, dan Gion.
Di Osaka: Dotonbori, Osaka Castle, dan day trip ke Nara untuk melihat rusa.

Tips: beli JR Pass sebelum berangkat, bawa cash secukupnya karena banyak
tempat kecil hanya terima tunai, dan download aplikasi peta offline.
Musim terbaik: sakura (akhir Maret) atau momiji (November).`},{title:"resep-rendang.md",path:"data/resep-rendang.md",text:`# Resep Rendang Sapi

Bahan utama: 1 kg daging sapi, santan dari 3 butir kelapa, dan bumbu halus.
Bumbu halus terdiri dari cabai merah, bawang merah, bawang putih, jahe,
lengkuas, kunyit, dan kemiri.

Cara memasak:
1. Tumis bumbu halus sampai harum dan matang.
2. Masukkan daging, aduk sampai berubah warna.
3. Tuang santan, masak dengan api kecil sambil sesekali diaduk.
4. Masak 3-4 jam sampai santan menyusut dan berminyak.

Kunci rendang enak: api kecil, sabar, dan santan kental yang berkualitas.
Jangan diaduk terlalu sering supaya daging tidak hancur.`}],jd=["rendang santan","python list","JR Pass Kyoto"],_d=240;function zd(v){return{key:v.chunk.id,title:v.chunk.title,path:v.chunk.path,score:v.score,snippetHtml:tc(v.snippet),detail:v.chunk.text.replace(/^#+\s*/gm,""),backend:"perangkat"}}function Pd(){const[v,w]=A.useState(""),[d,I]=A.useState(""),[C,O]=A.useState(yt.mode),[F,Q]=A.useState([]),[H,le]=A.useState(!1),[Z,V]=A.useState(""),[K,xe]=A.useState(()=>gd()),[me,b]=A.useState(!1),[Y,Oe]=A.useState(0),[Pe,Ne]=A.useState(null),[ve,Fe]=A.useState(0),[oe,ge]=A.useState(null),[fe,Te]=A.useState(null),Be=A.useRef(null),Ue=A.useRef(0),Le=A.useRef(0),Ce=A.useMemo(()=>{const x=Cd.flatMap(y=>Sd(y.title,y.path,y.text));return new Ed(x)},[]);A.useEffect(()=>{const x=setTimeout(()=>I(v.trim()),_d);return()=>clearTimeout(x)},[v]),A.useEffect(()=>{const x=d;if(!x){Q([]),le(!1),V(""),ge(null);return}le(!0),Oe(0),Ne(null),ge(null);const y=++Ue.current,f=performance.now();if(C==="offline")Q(Ce.search(x,10).map(zd)),Fe(performance.now()-f),V("");else{const g=Zt();if(!g){V("Isi URL server di Pengaturan."),Q([]);return}g.search(x,10).then(D=>{Ue.current===y&&(Q(D.hits.map(L=>({key:`${L.path}#${L.chunk}`,docId:L.doc_id,chunk:L.chunk,title:L.title,path:L.path,score:L.score,snippetHtml:tc(L.snippet),detail:L.snippet.replace(/<[^>]*>/g,"").replace(/^#+\s*/gm,""),backend:L.backend||"server"}))),Fe(performance.now()-f),V(""),g.answer(x).then(L=>{Ue.current===y&&L.answer&&ge(L)}).catch(()=>{}))}).catch(D=>{if(Ue.current!==y)return;Q([]),ge(null);const L=D instanceof Error?D.message:"";V(/failed to fetch|networkerror|load failed|network request failed/i.test(L)?"Server tidak terjangkau. Periksa URL server & koneksi internet.":L||"Server tidak terjangkau.")})}},[d,C,Ce]),A.useEffect(()=>{const x=d;if(C!=="api"||x.length<2){Te(null);return}const y=Zt();if(!y){Te(null);return}const f=++Le.current,g=setTimeout(()=>{y.suggest(x).then(D=>{Le.current===f&&Te(D)}).catch(()=>{Le.current===
