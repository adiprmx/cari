Itinerary 7 hari: Tokyo (3 hari), Kyoto (2 hari), Osaka (2 hari).
Budget estimasi: tiket pesawat 8 juta, hotel 6 juta, makan dan transport 5 juta.

Di Tokyo wajib ke: Asakusa, Shibuya crossing, Akihabara, dan teamLab Planets.
Di Kyoto: Fushimi Inari, Arashiyama bamboo grove, dan Gion.
Di Osaka: Dotonbori, Osaka Castle, dan day trip ke Nara untuk melihat rusa.

Tips: beli JR Pass sebelum berangkat, bawa cash secukupnya karena banyak
tempat kecil hanya terima tunai, dan download aplikasi peta offline.

Bahan utama: 1 kg daging sapi, santan dari 3 butir kelapa, dan bumbu halus.
Bumbu halus terdiri dari cabai merah, bawang merah, bawang putih, jahe,
lengkuas, kunyit, dan kemiri.

Cara memasak:
1. Tumis bumbu halus sampai harum dan matang.
2. Masukkan daging, aduk sampai berubah warna.
3. Tuang santan, masak dengan api kecil sambil sesekali diaduk.
4. Masak 3-4 jam sampai santan menyusut dan berminyak.

Kunci rendang enak: api kecil, sabar, dan santan kental yang berkualitas.
Jangan diaduk terlalu sering supaya daging tidak hancur.`}],Rd=["rendang santan","python list","JR Pass Kyoto"],Md=["teori relativitas","ibu kota australia","fotosintesis"],Id=240;function Dd(h){return{key:h.chunk.id,title:h.chunk.title,path:h.chunk.path,score:h.score,snippetHtml:tc(h.snippet),detail:h.chunk.text.replace(/^#+\s*/gm,""),backend:"perangkat"}}function Od(){const[h,y]=O.useState(""),[f,T]=O.useState(""),[E,F]=O.useState(xt.mode),[W,J]=O.useState("local"),[Q,oe]=O.useState(null),[ee,G]=O.useState(null),[B,se]=O.useState([]),[ye,ie]=O.useState(!1),[te,Ye]=O.useState(!1),[Pe,he]=O.useState(""),[xe,Fe]=O.useState(()=>yd()),[me,ke]=O.useState(!1),[je,Te]=O.useState(0),[Be,Ue]=O.useState(null),[Le,Ce]=O.useState(0),[we,_e]=O.useState(null),[ce,re]=O.useState(null),C=O.useRef(null),D=O.useRef(0),z=O.useRef(0),d=O.useMemo(()=>{const w=Ld.flatMap(_=>zd(_.title,_.path,_.text));return new Pd(w)},[]);O.useEffect(()=>{const w=setTimeout(()=>T(h.trim()),Id);return()=>clearTimeout(w)},[h]),O.useEffect(()=>{if(E!=="api"){oe(null);return}const w=jt();if(!w){oe(null);return}let _=!0;return w.health().then(A=>{_&&oe(!!A.web)}).catch(()=>{_&&oe(!1)}),()=>{_=!1}},[E]),O.useEffect(()=>{const w=f;if(!w){se([]),Ye(!1),he(""),_e(null),G(null),ie(!1);return}Ye(!0),Te(0),Ue(null),_e(null),G(null);const _=++D.current,A=performance.now();if(E==="offline")se(d.search(w,10).map(Dd)),Ce(performance.now()-A),he("");else if(W==="web"){const N=jt();if(!N){he("Isi URL server di Pengaturan."),se([]);return}ie(!0),se([]),N.webSearch(w,12).then(K=>{D.current===_&&(se(K.results.map(X=>({key:`web:${X.url}`,title:X.title,path:X.url,url:X.url,source:X.source,image:X.image,score:0,snippetHtml:xd(X.snippet),detail:X.snippet,backend:"web"}))),G({cached:K.cached,learned:K.learned,sources:K.sources}),Ce(performance.now()-A),he(""),ie(!1))}).catch(K=>{if(D.current!==_)return;se([]),G(null),ie(!1);const X=K instanceof Error?K.message:"";he(/failed to fetch|networkerror|load failed|network request faile
