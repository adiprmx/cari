ata/catatan-python.md",text:`# Catatan Belajar Python

Python adalah bahasa pemrograman yang populer untuk data science dan web development.
Fungsi didefinisikan dengan kata kunci \`def\`, sedangkan class dengan \`class\`.

List comprehension adalah cara ringkas membuat list:
hasil = [x*2 for x in range(10) if x % 2 == 0]

Virtual environment sebaiknya selalu dipakai per proyek:
python -m venv .venv

Untuk HTTP request, library \`requests\` atau stdlib \`urllib\` bisa dipakai.
Untuk web scraping sederhana, BeautifulSoup membantu parsing HTML.`},{title:"rencana-liburan-jepang.md",path:"data/rencana-liburan-jepang.md",text:`# Rencana Liburan ke Jepang

Itinerary 7 hari: Tokyo (3 hari), Kyoto (2 hari), Osaka (2 hari).
Budget estimasi: tiket pesawat 8 juta, hotel 6 juta, makan dan transport 5 juta.

Di Tokyo wajib ke: Asakusa, Shibuya crossing, Akihabara, dan teamLab Planets.
Di Kyoto: Fushimi Inari, Arashiyama bamboo grove, dan Gion.
Di Osaka: Dotonbori, Osaka Castle, dan day trip ke Nara untuk melihat rusa.

Tips: beli JR Pass sebelum berangkat, bawa cash secukupnya karena banyak
tempat kecil hanya terima tunai, dan download aplikasi peta offline.
Musim terbaik: sakura (akhir Maret) atau momiji (November).`},{title:"resep-rendang.md",path:"data/resep-rendang.md",text:`# Resep Rendang Sapi

Bahan utama: 1 kg daging sapi, santan dari 3 butir kelapa, dan bumbu halus.
Bumbu halus terdiri dari cabai merah, bawang merah, bawang putih, jahe,
lengkuas, kunyit, dan kemiri.

Cara memasak:
1. Tumis bumbu halus sampai harum dan matang.
2. Masukkan daging, aduk sampai berubah warna.
3. Tuang santan, masak dengan api kecil sambil sesekali diaduk.
