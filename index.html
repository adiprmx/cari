Python adalah bahasa pemrograman yang populer untuk data science dan web development.

List comprehension adalah cara ringkas membuat list:

Virtual environment sebaiknya selalu dipakai per proyek:

Itinerary 7 hari: Tokyo (3 hari), Kyoto (2 hari), Osaka (2 hari).
Budget estimasi: tiket pesawat 8 juta, hotel 6 juta, makan dan transport 5 juta.

Di Tokyo wajib ke: Asakusa, Shibuya crossing, Akihabara, dan teamLab Planets.
Di Kyoto: Fushimi Inari, Arashiyama bamboo grove, dan Gion.
Di Osaka: Dotonbori, Osaka Castle, dan day trip ke Nara untuk melihat rusa.

Tips: beli JR Pass sebelum berangkat, bawa cash secukupnya karena banyak
tempat kecil hanya terima tunai, dan download aplikasi peta offline.
Musim terbaik: sakura (akhir Maret) atau momiji (November).`},{title:"resep-rendang.md",path:"data/resep-rendang.md",text:`# Resep Rendang Sapi

Bahan utama: 1 kg daging sapi, santan dari 3 butir kelapa, dan bumbu halus.
Bumbu halus terdiri dari cabai merah, bawang merah, bawang putih, jahe,
lengkuas, kunyit, dan kemiri.

Cara memasak:
1. Tumis bumbu halus sampai harum dan matang.
2. Masukkan daging, aduk sampai berubah warna.
3. Tuang santan, masak dengan api kecil sambil sesekali diaduk.
4. Masak 3-4 jam sampai santan menyusut dan berminyak.

Kunci rendang enak: api kecil, sabar, dan santan kental yang berkualitas.
Jangan diaduk terlalu sering supaya daging tidak hancur.`}],Ld=["rendang santan","python list","JR Pass Kyoto"],Rd=["teori relativitas","ibu kota australia","fotosintesis"],Md=240;function Id(m){return{key:m.chunk.id,title:m.chunk.title,path:m.chunk.path,score:m.score,snippetHtml:tc(m.snippet),detail:m.chunk.text.replace(/^#+\s*/gm,""),backend:"perangkat"}}function Dd(){const[m,x]=O.useState(""),[f,T]=O.useState(""),[N,F]=O.useState(yt.mode),[Q,J]=O.useState("local"),[K,re]=O.useState(null),[b,Y]=O.useState(null),[B,oe]=O.useState([]),[ye,le]=O.useState(!1),[q,je]=O.useState(""),[Oe,Fe]=O.useState(()=>yd()),[de,Pe]=O.useState(!1),[pe,he]=O.useState(0),[Ce,Re]=O.useState(null),[Ue,Be]=O.useState(0),[ke,we]=O.useState(null),[me,_e]=O.useState(null),Se=O.useRef(null),ee=O.useRef(0),C=O.useRef(0),D=O.useMemo(()=>{const S=Td.flatMap(_=>_d(_.title,_.path,_.text));return new zd(S)},[]);O.useEffect(()=>{const S=setTimeout(()=>T(m.trim()),Md);return()=>clearTimeout(S)},[m]),O.useEffect(()=>{if(N!=="api"){re(null);return}const S=Nt();if(!S){re(null);return}let _=!0;return S.health().then(A=>{_&&re(!!A.web)}).catch(()=>{_&&re(!1)}),()=>{_=!1}},[N]),O.useEffect(()=>{const S=f;if(!S){oe([]),le(!1),je(""),we(null),Y(null);return}le(!0),he(0),Re(null),we(null),Y(null);const _=++ee.current,A=performance.now();if(N==="offline")oe(D.search(S,10).map(Id)),Be(performance.now()-A),je("");else if(Q==="web"){const W=Nt();if(!W){je("Isi URL server di Pengaturan."),oe([]);return}W.webSearch(S,10).then(G=>{ee.current===_&&(oe(G.results.map(g=>({key:`web:${g.url}`,title:g.title,path:g.url,url:g.url,source:g.source,image:g.image,score:0,snippetHtml:xd(g.snippet),detail:g.snippet,backend:"web"}))),Y({cached:G.cached,learned:G.learned,sources:G.sources}),Be(performance.now()-A),je(""))}).catch(G=>{if(ee.current!==_)return;oe([]),Y(null);const g=G instanceof Error?G.message:"";je(/failed to fetch|networkerror|load failed|network request failed/i.test(g)?"Server tidak terjangkau. Periksa URL serve
